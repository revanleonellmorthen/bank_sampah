name: Generate PlantUML Diagrams

on:
  push:
    branches:
      - '**'
    paths:
      - '**.puml'

permissions:
  contents: write

jobs:
  plantuml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java (Wajib untuk PlantUML)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PlantUML
        run: |
          wget -q https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar

      - name: Generate SVG
        run: |
          # Mencari semua file .puml di folder manapun dan mengubahnya jadi .svg
          find . -name "*.puml" -exec java -jar plantuml-1.2024.7.jar -tsvg {} \;

      - name: Commit & Push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-render PlantUML diagrams to SVG"
          file_pattern: "*.svg **/*.svg"
