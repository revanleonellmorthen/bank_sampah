name: Generate PlantUML Diagrams

on:
  push:
    branches:
      - '**'
    paths:
      - '**.puml'

permissions:
  contents: write

jobs:
  plantuml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate SVG via PlantUML Server
        uses: grassedge/generate-plantuml-action@v1.5
        with:
          path: docs/usecase   # Ganti jika file .puml kamu ada di folder lain
          message: "Render PlantUML diagrams to SVG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
